name: 04 - Uso de Actions
on: push
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 'Checkout Code'          
        uses: actions/checkout@v6
      - name: 'Node Setup'
        uses: actions/setup-node@v6
        with:
          node-version: '20.x'
      - name: 'Install Dependencies'
        run: npm ci
        working-directory: my-app



