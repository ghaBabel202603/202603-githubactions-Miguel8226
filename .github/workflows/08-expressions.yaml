name: 08 - Expressions
run-name: 08 - Expressions
on: 
    push:
    workflow_dispatch: 
        inputs:
            debug:
                description: 'Enable debug mode'
                required: false
                default: 'false'
                type: boolean
jobs:
    echo:
        runs-on: ubuntu-latest
        steps:
            - name: Test
              if: github.event_name == 'push'
              run: |
                echo "I was triggered by a push event" 
                echo "Triggered by: ${{ github.event_name }}"
                echo 'Branch: ${{ github.Branch }}'
                echo 'Commit SHA: ${{ github.SHA }}'
                echo 'Runner OS: ${{ Runner.OS }}'
            - name: '[valor de debug] Print when triggered from main'
              if: github.ref == 'refs/heads/main' && inputs.debug == 'true'
              run: echo "I was triggered from main"
            - name: Greeting
              run: echo "Hello world" 

