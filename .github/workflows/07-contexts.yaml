name: 07 - Contexts
on:
    push:
    workflow_dispatch:
jobs:
    echo-data:
        runs-on:  ubuntu-latest
        steps:
            - name: 'Show Info'
              run:  echo 'evento ${{ github.event_name }}'
                    echo 'ref ${{ github.ref }}'
                    echo 'evento ${{ github.sha }}'
                    echo 'evento ${{ github.actor }}'
                    echo 'evento ${{ github.workflow }}'
                    echo 'evento ${{ github.run_id }}'
                    echo 'evento ${{ github.run_number }}' 
          #  - name: 'Retrieve Variable'
          #      run: echo 'el valor de mi variable es: ${{ vars.my_var}}'